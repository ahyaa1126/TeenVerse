<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · TeenVerse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>

  <main class="auth-card">
    <a class="back-link" href="index.html">← Back</a>
    <div class="logo-mark small-logo">🌊</div>
    <h1>Welcome Back</h1>
    <p class="auth-copy">Sign in to continue to TeenVerse.</p>

    <form id="loginForm" class="auth-form">
      <label>Username
        <input id="username" required autocomplete="username" placeholder="Your username">
      </label>
      <label>Password
        <input id="password" type="password" required autocomplete="current-password" placeholder="Your password">
      </label>
      <button class="primary-button" type="submit">Enter TeenVerse</button>
      <p id="status" class="status"></p>
    </form>

    <p class="switch-copy">New here? <a href="register.html">Create an account</a></p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
